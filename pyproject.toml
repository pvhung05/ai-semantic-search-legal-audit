[project]
name = "audit-legal"
version = "0.3.0"
description = "Service doi chieu van ban du thao voi kho phap luat Viet Nam"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "rapidfuzz>=3.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: test can goi LLM that (bo qua khi khong co LLM_URL)",
    "integration: test can DB that",
]
